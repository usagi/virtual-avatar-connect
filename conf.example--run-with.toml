# =========================================================================
#  conf.example--run-with.toml  (v2)
# =========================================================================
# VAC 起動時に、同時に立ち上げたい外部プロセスを列挙する設定。
# （AI / TTS エンジン / 配信機材を VAC 起動でまとめて立ち上げたいとき用）
#
# - OS のコマンドとして解釈可能な文字列 / URL / オブジェクト形式で指定できる。
# - `if_not_running` で指定した実行ファイル名が既に動いていればスキップ。
# - `run_as_admin = true` で UAC 昇格を要求（昇格ダイアログがユーザーに出る）。
# - `working_dir` で作業ディレクトリ指定。
# - `minimized = true` で最小化状態で起動（CreateProcess + STARTUPINFO、
#   Toolhelp のプロセス木 + ウィンドウ列挙→最小化。親子が切れた場合は
#   タイトル部分一致へフォールバック。http(s) URL では無視される）。
#
# お試し: `virtual-avatar-connect.exe` にドラッグ＆ドロップ、または CLI 引数で指定。
# =========================================================================

run_with = [
 # どうあれメモ帳を起動。
 "notepad",

 # どうあれ URL を開く。
 "http://127.0.0.1:57000/input",

 # まだ動作していない場合のみ、CoeiroInk を起動。
 { command = '''C:\Users\the\app\COEIROINK_WIN_GPU_v.2.1.1\COEIROINKv2.exe''', if_not_running = "COEIROINKv2" },

 # まだ動作していない場合のみ、VirtualMotionCapture を起動。
 { command = '''C:\Users\the\app\vmc\VirtualMotionCapture.exe''', if_not_running = "VirtualMotionCapture" },

 # まだ動作していない場合のみ、WebcamMotionCapture を起動。
 { command = '''C:\Users\the\app\WebcamMotionCapture_Win\bin\webcam_motion_capture\webcam_motion_capture.exe''', if_not_running = "webcam_motion_capture" },

 # まだ動作していない場合のみ、VMagicMirror を起動。
 { command = '''"C:\Program Files (x86)\VMagicMirror\VMagicMirror.exe"''', if_not_running = "VMagicMirror" },

 # まだ動作していない場合のみ、OBS Studio を管理者権限 + 作業ディレクトリ指定で起動。
 { command = '''C:\Program Files\obs-studio\bin\64bit\obs64.exe''', if_not_running = "obs64.exe", run_as_admin = true, working_dir = '''C:\Program Files\obs-studio\bin\64bit''' },

 # 最小化起動の例（http(s) URL では無視される）
 # { command = '''C:\path\to\app.exe''', if_not_running = "app", minimized = true },
]
