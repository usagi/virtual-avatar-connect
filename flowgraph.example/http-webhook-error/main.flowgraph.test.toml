[mocks]

[[mocks.http]]
node = "main::http_request"
error = "fixture network down"

[[triggers]]
node = "main::webhook_in"

[[triggers.overrides]]
port = "__content__"
ty = "string"
value = "fixture webhook"

[[triggers.overrides]]
port = "__source_kind__"
ty = "string"
value = "fixture"

[[tests]]
name = "http request error mock"

[tests.expect]
node_count = 8
mock_count = 1
trigger_count = 1
trace_count = 3
effect_count = 1
trace = [
  "http.request mock: POST http://127.0.0.1:8787/webhook -> node main::http_request",
  "http.request: POST http://127.0.0.1:8787/webhook error: fixture network down",
  "log: fixture network down",
]

[[tests.expect.exec_count]]
node = "main::log_response"
count = 0

[[tests.expect.exec_count]]
node = "main::log_error"
count = 1

[[tests.expect.stored_values]]
node = "main::http_request"
port = "ok"
ty = "bool"
value = false

[[tests.expect.stored_values]]
node = "main::http_request"
port = "error"
ty = "string"
value = "fixture network down"

[[tests.expect.http_requests]]
node = "main::http_request"
method = "POST"
url = "http://127.0.0.1:8787/webhook"
request_body = { source = "VAC", event = "web_input" }
error = "fixture network down"
