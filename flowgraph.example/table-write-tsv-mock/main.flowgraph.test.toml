[mocks]

[[mocks.file_read]]
node = "main::load"
contents = """
source	replacement
hello	hi
vac	VAC
"""

[[mocks.file_write]]
node = "main::write"

[[triggers]]
node = "main::in"

[[tests]]
name = "table write tsv file mock"

[tests.expect]
node_count = 6
mock_count = 2
trigger_count = 1
trace_count = 2
effect_count = 1
trace = [
  "file.read mock: fixture.tsv -> node main::load",
  "file.write mock: out.tsv (36 bytes) -> node main::write",
]

[[tests.expect.exec_count]]
node = "main::load"
count = 1

[[tests.expect.exec_count]]
node = "main::write"
count = 1

[[tests.expect.stored_values]]
node = "main::write"
port = "bytes_written"
ty = "int"
value = 36

[[tests.expect.stored_values]]
node = "main::write"
port = "error"
ty = "string"
value = ""

[[tests.expect.file_writes]]
node = "main::write"
path = "out.tsv"
bytes = 36
contents = """
source	replacement
hello	hi
vac	VAC
"""
