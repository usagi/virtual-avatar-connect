# fixture file_read mock で TSV load を検証する最小例。

[meta]
title = "table load tsv mock"
description = "Fixture の file_read mock で flowgraph.table.load_tsv を実ファイルなしに検証する"
tags = ["example", "table", "tsv", "fixture", "mock"]

[[nodes]]
id = "in"
feature = "flowgraph.ingress.web_input"
position = [80, 140]
properties.path = "/input/table-load-tsv-mock"
properties.method = "POST"
properties.body_format = "plain"
properties.fixed_channel = "table_load_tsv_mock"

[[nodes]]
id = "path"
feature = "flowgraph.literal.string"
position = [320, 240]
properties.value = "fixture.tsv"

[[nodes]]
id = "mode"
feature = "flowgraph.literal.string"
position = [320, 320]
properties.value = "headerful"

[[nodes]]
id = "load"
feature = "flowgraph.table.load_tsv"
position = [560, 140]

[[edges]]
from = "in:exec_out"
to = "load:exec_in"

[[edges]]
from = "path:value"
to = "load:path"

[[edges]]
from = "mode:value"
to = "load:mode"
