[meta]
title = "ν fixture: web_input + dictionary learn/forget"
description = """
Phase ν Playwright E2E で使う最小 flowgraph。
- `in`  (web_input) → `log` は §3.5 の ingress → WS 配信経路を保つ
- `learn` / `forget` は §3.4 Live Quick-Add の trigger 対象（外部入力でだけ発火）

ν-β-3 以降、`dictionary` 入力 (Table) の default は engine 側で `Table::empty()` に coerce
されるため、補助ノード (`flowgraph.table.from_json`) なしで trigger 経路が成立する。
"""
tags = ["fixture", "e2e", "ν"]

# --- §3.5 で使う ingress 経路 ---

[[nodes]]
id = "in"
feature = "flowgraph.ingress.web_input"
position = [80, 200]

[[nodes]]
id = "log"
feature = "flowgraph.util.log"
position = [360, 200]

[[edges]]
from = "in:exec_out"
to = "log:exec_in"

[[edges]]
from = "in:content"
to = "log:value"

# --- §3.4 Live Quick-Add 用 trigger ターゲット ---
#
# ν-β-3 時点で `dictionary` 入力の default coerce が engine 側で通るため、補助の
# `flowgraph.table.from_json` ノードは不要。trigger 経路の pull 評価中に `Table::empty()`
# が default として注入され、`learn:dictionary` / `forget:dictionary` が満たされる。

[[nodes]]
id = "learn"
feature = "flowgraph.dictionary.learn"
position = [620, 400]

[[nodes]]
id = "forget"
feature = "flowgraph.dictionary.forget"
position = [620, 520]
