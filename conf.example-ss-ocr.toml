# =========================================================================
#  conf.example-ss-ocr.toml  (v2)
# =========================================================================
# スクリーンショット + OCR の **リファレンス**。
#
# v1 では `[[processors]] feature = "screenshot"` と `feature = "ocr"` の 2 つを
# チャンネル名で連鎖させる必要があった。v2 では **1 つの Flowgraph** で
# `screenshot.capture` → `ocr.recognize` を直接繋げばよい。
#
# v2 ノード:
#   flowgraph.screenshot.capture   ウィンドウ / デスクトップのキャプチャ
#   flowgraph.ocr.recognize        画像 → 文字列（Windows Media OCR）
#
# 対応サンプル:
#   flowgraph.example/ocr-screencap/   ← 最小 SS + OCR
#
# プラットフォーム:
#   両ノード共 Windows のみ実装。非 Windows では `on_error` 即返り。
# =========================================================================


# -------------------------------------------------------------------------
# 1. conf.toml 側に必要な設定
# -------------------------------------------------------------------------
# なし。すべて Flowgraph 側のノード入力で完結する。


# -------------------------------------------------------------------------
# 2. `flowgraph.screenshot.capture` 入力
# -------------------------------------------------------------------------
#   target_title        ウィンドウタイトル完全一致。空文字ならデスクトップ全体。
#   target_title_regex  タイトル正規表現。target_title より優先。
#   client_only (Bool)  クライアント領域のみ（false でフレーム込み）
#   use_bitblt  (Bool)  true で BitBlt 方式（既定は PrintWindow）
#   crop        (Json)  null でクロップなし。`{"x":N,"y":N,"w":N,"h":N}` で切り出し。
#   save_path   (Str)   空なら保存しない。`{T}` が UTC ISO 日時に展開。


# -------------------------------------------------------------------------
# 3. `flowgraph.ocr.recognize` 入力
# -------------------------------------------------------------------------
#   source             ローカルパス / file:/// / http(s):// / data:image/... のいずれか
#                      （typical: screenshot.capture の `data_url` 出力をそのまま繋ぐ）
#   lang               BCP-47（例: "ja-JP" / "en-US"）
#   lines              true で行単位、false で全文一括
#   check_result_lang  true で認識後の言語判定を行い、lang と不一致なら error
