# =========================================================================
#  conf.example-openai-chat.toml  (v2, Phase χ / OpenAI Responses API)
# =========================================================================
# OpenAI Responses API ベースの AI ペルソナ（常駐 AI サービス）。
#
# Phase χ (OpenAI Responses API 移行) 以降、VAC の AI ペルソナは `/v1/responses`
# エンドポイントを唯一の経路として使う。旧 Chat Completions (`/v1/chat/completions`)
# は完全に撤去済み。ファイル名に `-chat` が残っているのは歴史的経緯で、
# 内容は Responses API 用。
#
# ■ Phase χ で変わったところ（ユーザ視点の要点）
#   - 新キー `openai_max_output_tokens` (u32) を推奨。legacy `max_tokens` (u16) は
#     `openai_max_output_tokens` が空のときだけ fallback として使われる。
#   - 新キー `memory_overflow_summary_max_output_tokens` (u32)。legacy
#     `memory_overflow_summary_max_completion_tokens` (u16) が fallback。
#   - 新キー `openai_reasoning_effort`（`"low"`/`"medium"`/`"high"`）。gpt-5 系専用。
#   - 新キー `openai_store`（bool、既定 `false`）。OpenAI 側に会話 state を保存するか。
#     既定で無効化（VAC は client 側で memory window を完全管理しているので不要）。
#   - 環境変数 `VAC_OPENAI_MAX_OUTPUT_TOKENS` で conf 側より優先的に上書き可能。
#   - tools.json は Responses API のフラット形式 (`{"type":"function","name":...}`)
#     を推奨。旧 Chat Completions 形式 (`{"type":"function","function":{...}}`) も
#     `parse_tools_json` が後方互換で受け付けるので、既存 conf はそのまま動く。
#
# v2 では `[[ai.personas]]` は **常駐タスク**として動作する（Flowgraph とは別ラインの
# AI サービス）。Flowgraph の副作用ノードから呼び出すのではなく、自身で:
#   - 指定した `observe.triggers` チャンネルを購読し
#   - Decision Engine で応答の要否を判定し
#   - `channel_utterance` に ChannelDatum を emit する
# という独立したループを回す。
#
# 対応する Flowgraph サンプル: `flowgraph.example/openai-persona/`
#   AI が `channel_utterance = "ai"` に書き出した発話を、TTS やブラウザソースへ
#   分岐する最小の graph を示す（ただし「チャンネル購読 ingress」は現状 v2 に
#   未実装なので、実際の配線は V1 runtime がまだ担当している。δ-9 で v2 完結）。
# =========================================================================


# -------------------------------------------------------------------------
# 1. ペルソナ 1 つ分の最小テンプレート
# -------------------------------------------------------------------------
# 複数キャラクター運用したいときは `[[ai.personas]]` ブロックを増やす。

[[ai.personas]]

# ペルソナ識別子。ログや `--persona-id` CLI 指定で参照。
id = "default"

# 発話出力先チャンネル（Flowgraph / TTS / Twitch 送信 processor が購読）。
channel_utterance = "ai"

# 観測ルール:
#  - triggers:          このチャンネル群を **応答判定の起点**に使う（発話ごとに Decision Engine へ）。
#  - include_all:       true で全チャンネルの `is_final` 発話を memory window に載せる（他キャラとの対話観測）。
#  - include_additional: include_all=false のときに追加で文脈に乗せたいチャンネル。
#  - exclude:           上記の打ち消し。debug / ログ系は通常ここで除外。
observe.triggers = ["user"]
# observe.include_all = true
# observe.include_additional = ["chat"]
# observe.exclude = ["debug"]

# `vac_emit_effect` function tool が書き出すチャンネル（省略時 "effect"）。
# channel_effect = "effect"


# -------------------------------------------------------------------------
# 2. API キー（環境変数推奨）
# -------------------------------------------------------------------------
# `api_key = "..."` を直書きも可能だが、リポジトリや配信画面に載らないよう
# 環境変数 `OPENAI_API_KEY` での指定を推奨。
# api_key = "sk-..."


# -------------------------------------------------------------------------
# 3. モデル
# -------------------------------------------------------------------------
# モデル ID: https://platform.openai.com/docs/models
model = "gpt-4o-mini"

# --- 料金の目安（試算のみ・一切保証しません）---
# 2026-04-16 時点・OpenAI API Standard 掲載単価に基づく雑な試算。
# 前提: 1 日あたり 入力 約 192k / 出力 約 9k トークン × 30 日。$1=150 円。
#
# | モデル（例）   | 約 USD / 30 日 | 約円（※150 円/ドル） |
# |----------------|----------------|----------------------|
# | gpt-4o mini    | 約 $1.0        | 約 150 円            |
# | GPT-5.4 nano   | 約 $1.5        | 約 220 円            |
# | GPT-5.4 mini   | 約 $5.5        | 約 830 円            |
# | GPT-5.4        | 約 $18.4       | 約 2,800 円          |


# -------------------------------------------------------------------------
# 4. 人格・長期メモ（system prompt 群）
# -------------------------------------------------------------------------
# メッセージ組み立て順（固定。Responses API の `input[]` として送る）:
#   1. custom_instructions（system/developer）→ 任意で system_instructions_extra（system/developer）
#   2. gpt-5 系で上記が 1 本も無いときだけ既定 system/developer を先頭 insert
#   3. memory_summary と memory_summary_path を 1 本の system/developer に連結（ファイルが先、`---` で inline）
#   4. openai_few_shot（user / assistant / system）
#   5. 任意: persona_anchor（system/developer・履歴直前）
#   6. 短期窓（user / assistant。他チャンネルは "[名前@source] 本文" 形式の system 等）
#
# Responses API 仕様: gpt-5 系の reasoning モデルに対しては system role ではなく
# `developer` role を明示的に使うのが推奨とされている。VAC は model 名が `gpt-5` で
# 始まるときだけ自動で `developer` role に切り替えるので、conf 側の書き方は従来通り
# （`custom_instructions` などを書けばよい）で問題ない。
#
# custom_instructions = """あなたの役割と口調の前提（必須に近い）"""
#
# ζ-4（案 Z ハイブリッド）: Twitch 連携時の行動規範サンプル
# AI→Twitch チャット中継は「定型＝Flowgraph（cheer 謝意・raid 歓迎など）、判断＝AI tool
# （文脈が明らかなときだけ AI が能動的に発言）」で分業する。AI 側の custom_instructions
# に以下のような一文を足しておくと、vac_twitch_chat_say が濫用されにくい:
#
# custom_instructions = """
# あなたは配信者のバーチャルアシスタントです。通常の発話は配信上で TTS で読み上げられ、
# Twitch チャットへも自動中継されます。したがって `vac_twitch_chat_say` ツールは **通常呼ばないでください**。
# 次のいずれかに該当するときだけ、このツールで「Twitch チャットにだけ」文字列を送ってください:
#   - 配信者やモデレーターから明示的に「Twitch にこう返して」と指示されたとき
#   - 配信者が気付いていないメンション・質問に、テキストだけで簡潔に公式回答したいとき
# 上記以外では通常の発話で応答してください。同じ内容を TTS と Twitch 両方へ重ねないこと。
# """
# system_instructions_extra = """追加ルール・シーンごとの補足"""
# memory_summary = """直近の配信の要点など（任意）"""
# memory_summary_path = "C:/path/to/summary.txt"


# -------------------------------------------------------------------------
# 5. Few-shot / anchor
# -------------------------------------------------------------------------
# openai_few_shot = [
#  { role = "user", content = "…" },
#  { role = "assistant", content = "…" },
# ]
# persona_anchor = "この直後のユーザー発話に、上記の人格で答える"


# -------------------------------------------------------------------------
# 6. 短期メモリ窓
# -------------------------------------------------------------------------
# memory_capacity = 8
# memory_budget_approx_tokens = 1500        # 1 token ≈ 4 chars で削る（memory_max_chars より優先）
# memory_budget_chars_per_approx_token = 4
# memory_max_chars = 6000
#
# --- あふれ要約（別 API で old turn を要約し long-term memory 先頭に連結）---
# memory_overflow_summary_enabled = true
# memory_overflow_summary_model = "gpt-4o-mini"             # 未指定なら上の model と同じ
# memory_overflow_summary_max_output_tokens = 256           # χ-6 推奨（Responses API `max_output_tokens`）
# # memory_overflow_summary_max_completion_tokens = 256     # legacy (u16)。上が未指定時のみ fallback
# memory_overflow_summary_max_input_chars = 16000
# memory_overflow_summary_min_chars = 64
# memory_overflow_summary_cooldown_secs = 45


# -------------------------------------------------------------------------
# 7. 応答・通信
# -------------------------------------------------------------------------
# n = 2                                     # 候補数（openai_stream=true なら 1 に上書き）
# openai_max_in_flight = 2
# openai_stream = true
# assistant_max_chars = 500
# assistant_strip_substrings = ["NGワード1", "NGワード2"]
#
# --- Responses API 固有（χ-6 で追加）---
# openai_max_output_tokens = 1024           # Responses API の `max_output_tokens`（u32）。
#                                           # 未指定時は env `VAC_OPENAI_MAX_OUTPUT_TOKENS`、
#                                           # それも無ければ legacy `max_tokens`（u16）へ fallback。
# # max_tokens = 1024                         # legacy（Chat Completions 時代）。上が指定されていたら無視。
# openai_reasoning_effort = "medium"        # "low" | "medium" | "high"。gpt-5 系のみ有効。
#                                           # 非 gpt-5 モデルでは警告ログを出して黙殺する。
# openai_store = false                      # 既定 false（VAC は client 側で会話履歴を完全管理）。
#                                           # OpenAI Dashboard > Logs で生 Response を見たいときだけ true。
#                                           # Phase ψ-α で `include: ["reasoning.encrypted_content"]` を
#                                           # 採用する際も `store = false` のまま運用する方針。


# -------------------------------------------------------------------------
# 8. Function calling (tools)
# -------------------------------------------------------------------------
# 同梱 `conf.example-openai-tools.json` をコピーして使う。
# 標準ツール:
#   vac_ping                   疎通確認（副作用なし）
#   vac_emit_effect            channel_effect へ ChannelDatum push（演出）
#   vac_twitch_set_category    カテゴリ変更（要 `channel:manage:broadcast`）
#   vac_twitch_chat_say        Helix POST /chat/messages（モデレーター/ボット口発話）
#   vac_twitch_ban_user        BAN / timeout（duration_secs 未指定で永久）
#   vac_twitch_unban_user      BAN / timeout 解除
#   vac_twitch_delete_message  特定メッセージ削除
#
# モデレーション系は [twitch.moderator] の OAuth が必要（`conf.example-twitch.toml`）。
#
# --- tools.json の形式（χ-5 以降）---
#
# Phase χ で Responses API に切り替えた結果、公式の tools 形式は「フラット」形に
# なった。推奨形:
#
#   [
#     { "type": "function", "name": "vac_ping",
#       "description": "...",
#       "parameters": { "type": "object", "properties": {} } }
#   ]
#
# 旧 Chat Completions 形式（`{"type":"function","function":{...}}`）も
# `parse_tools_json` が後方互換で受け付けるので、既存 conf を書き換えなくても
# そのまま動く。新規作成時は Responses 形式を使うのが望ましい。
# 同梱の `conf.example-openai-tools.json` は旧形式のまま残してあるので、
# Responses 形式への書き換え例としては上の snippet を参照。
#
# --- hosted tools（Responses API から新規採用可能、χ 時点では optional）---
#
# Responses API は `web_search` / `file_search` / `code_interpreter` といった
# OpenAI ホステッドツールも同じ tools 配列に混ぜられる。VAC 側は hosted tool を
# 「宣言のみ、dispatch は OpenAI 側」として通す（tool_call に対するローカル実装は不要）。
#
#   [
#     { "type": "function", "name": "vac_ping", "parameters": {...} },
#     { "type": "web_search", "search_context_size": "medium" },
#     { "type": "file_search", "vector_store_ids": ["vs_..."] }
#   ]
#
# openai_tools_json_path = "C:/path/to/tools.json"
# openai_tool_choice = "auto"       # none / auto / required / function:<name> / custom:<name>
# openai_parallel_tool_calls = false


# -------------------------------------------------------------------------
# 9. 応答判定（シンプル legacy 記法）
# -------------------------------------------------------------------------
# `[ai.personas.decision]` を書かない場合はこれらが自動で Decision Engine に合成される。
# 挙動: ignore_regex_pattern が最優先でブロック → force_activate_regex_pattern で強制応答 →
# それ以外は常時応答 → min_interval_in_secs が hard gate。
#
# force_activate_regex_pattern = "(名前|ねえ|おーい)"
# ignore_regex_pattern = "^\\s*$"
# min_interval_in_secs = 3


# -------------------------------------------------------------------------
# 10. 応答判定（Decision Engine / 高度）
# -------------------------------------------------------------------------
# 合計スコア = base_score + Σ modulators + ±jitter。`threshold` 以上で応答。
#
# [ai.personas.decision]
# threshold = 50.0
# base_score = 0.0
# jitter = 5.0
# min_interval_in_secs = 3
#
# [[ai.personas.decision.modulators]]
# kind = "regex_ignore"
# pattern = "^\\s*$"
#
# [[ai.personas.decision.modulators]]
# kind = "regex_match"
# pattern = "(名前|ねえ|おーい)"
# score = 1000.0
#
# [[ai.personas.decision.modulators]]
# kind = "channel_match"
# channels = ["user"]
# score = 40.0
#
# [[ai.personas.decision.modulators]]
# kind = "always"
# score = 10.0


# -------------------------------------------------------------------------
# 11. Heartbeat（自発発話の外部トリガー）
# -------------------------------------------------------------------------
# [ai.personas.heartbeat]
# enabled = true
# interval_secs = 60
#
# [[ai.personas.decision.modulators]]
# kind = "silence_since"
# threshold_secs = 120
# score_per_sec = 0.5
# max_score = 80.0


# -------------------------------------------------------------------------
# 12. ファインチューン（学習データ経路）
# -------------------------------------------------------------------------
# fine_tuning = { train_path = "my-char.csv", suffix = "my-char" }
