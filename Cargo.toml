[package]
name = "virtual-avatar-connect"
version = "0.10.0"
edition = "2021"
build = "build.rs"
default-run = "virtual-avatar-connect"

[workspace]
members = [".", "vac-gui-assets"]
default-members = ["."]
resolver = "2"

[lib]
name = "virtual_avatar_connect"
path = "src/lib.rs"

[[bin]]
name = "virtual-avatar-connect"
path = "src/main.rs"

# η-5: V1 dictionary / regex ファイル → η 統一 11 カラム TSV 変換 CLI
[[bin]]
name = "virtual-avatar-connect-migrate-dict"
path = "src/bin/migrate_dict.rs"

[dependencies]
anyhow = "1.0.102"
# 0.34+ はデフォルトが TLS のみ。利用する API ごとに feature を足す（`chat-completion` 単独に固定する意味はない）。
# 全体をまとめたい場合は `full` も可だがコンパイルが重くなる。
async-openai = { version = "0.34", features = [
 "chat-completion",
 "finetuning",
 "file",
] }
clap = { version = "4.6.0", features = ["derive"] }
clap_lex = "1.1.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7"
env_logger = "0.11.10"
tokio = { version = "1.51.0", features = ["full"] }
toml = "1.1.2"
toml_edit = "0.23.7"
rand = "0.10.0"
noise = "0.9"
actix-web = "4.13.0"
actix = "0.13.5"
thiserror = "2.0.18"
reqwest = { version = "0.13.2", features = [
 "multipart",
 "json",
 "blocking",
 "stream",
] }
rodio = "0.22.2"
num_cpus = "1.17.0"
actix-files = "0.6.10"
urlencoding = "2.1.3"
# https://github.com/usagi/virtual-avatar-connect/issues/13
# tts = "0.25.6"
tts = { git = "https://github.com/Bear-03/tts-rs", branch = "synthesize" }
async-trait = "0.1.89"
ron = "0.12.1"
regex = "1.12.3"
actix-web-actors = "4.3.1"
win_ocr = "0.1.3"
screenshot-rs = "0.1.5"
screenshots = "0.8.10"
image = "0.25.10"
base64 = "0.22.1"
sha2 = "0.10"
unic-langid = "0.9.6"
async-tempfile = "0.7.0"
mime = "0.3.17"
mime_guess = "2.0.5"
alkana-rs = "0.1.0"
whatlang = "0.18.0"
isolang = { version = "2.4.0", features = ["list_languages"] }
os_info = "3.14.0"
async-recursion = "1.1.1"
sysinfo = "0.38.4"
webbrowser = "1.2.0"
duct = "1.1.1"
runas = "1.2.0"
csv-async = { version = "1.3.1", features = ["tokio"] }
futures = "0.3.32"
twitch-irc = "6.0.0"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
csv = "1.4.0"
rmp-serde = "1.3"
# キャッシュパス・LibreTranslate embed 展開
dirs = "6.0"
# LibreTranslate: embeddable Python zip 展開
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# 《Voice》: マイク入力（Vosk / Whisper 共通）
cpal = "0.17"
shlex = "1.3.0"
# η: 辞書 Table content-hash（Stateful Replace/Match のキャッシュ識別）
blake3 = "1.5"
# η: 辞書 literal マッチングの高速化（DFA ベース）
aho-corasick = "1.1"
# χ: OpenAI Responses API の SSE ストリーム（`reqwest::Response` の bytes stream を SSE イベント単位に割る）。
eventsource-stream = "0.2"
# χ-2: `sse::stream_events` の公開シグネチャで `bytes::Bytes` を名前付きで使うため直接依存を宣言。
# reqwest / eventsource-stream が推移的に依存しているので追加コストは実質ゼロ。
bytes = "1"
jiff = { version = "0.2.24", features = ["serde"] }
vac-gui-assets = { path = "vac-gui-assets", optional = true }

[dependencies.vosk]
version = "0.3.1"
optional = true

[features]
# 《Voice》: 既定で Vosk を含む（プロセッサー `voice` のデフォルトエンジン）。除外する場合は `cargo build --no-default-features`
default = ["voice-vosk"]
# v2 Step 6: `vac-gui-assets` 経由で `gui/dist` を取り込み `/gui/*` をメモリ配信。事前に `cd gui && npm ci && npm run build` が必須。
embed-gui = ["dep:vac-gui-assets"]
# 《Voice》: Vosk。Windows では build.rs が vosk-win64 の zip を .vendors にキャッシュし DLL を target/{profile}/ へコピー（上書き: VOSK_LIB_PATH）
voice-vosk = ["dep:vosk"]
# 《Voice》: Whisper（whisper.cpp）。CMake・LLVM（libclang）・C++ が必要: `cargo build --features voice-whisper`
voice-whisper = ["dep:whisper-rs"]

# 《Voice》 Whisper 用（--features voice-whisper）
[dependencies.whisper-rs]
version = "0.16.0"
optional = true
features = ["log_backend"]

# Windows Only
[target.'cfg(windows)'.dependencies]
win-screenshot = "4.0.14"
windows = { version = "0.62", features = [
 "Media_Ocr",
 "Win32_Foundation",
 "Win32_System_Diagnostics_ToolHelp",
 "Win32_System_SystemServices",
 "Win32_System_Threading",
 "Win32_Graphics",
 "Win32_Graphics_Gdi",
 "Win32_Storage",
 "Win32_Storage_Xps",
 "Win32_UI",
 "Win32_UI_HiDpi",
 "Win32_UI_Shell",
 "Win32_UI_WindowsAndMessaging",
 "Storage_Streams",
 "Foundation_Collections",
 "Globalization",
 "Graphics",
 "Graphics_Imaging",
] }
winapi = { version = "0.3.9", features = ["wincodec"] }

[build-dependencies]
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
