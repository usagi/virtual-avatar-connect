# =========================================================================
#  virtual-avatar-connect (VAC)  v2 初期設定ファイル
# =========================================================================
# このファイルは **v2 (Flowgraph) 時代の最小構成テンプレート** です。
# 旧バージョンの `[[processors]]` ベースの配線はすべて **Flowgraph** に移行しました。
# データの入出力・変換・外部連携はすべて `flowgraph_dir` 配下の
# `*.flowgraph.toml` で表現します（GUI で視覚的に編集可）。
#
# 個別機能ごとの設定例（Twitch / OpenAI / VOICEVOX / OCR / ...）は
# `conf.example-*.toml` シリーズを参照。必要な部分だけコピーして本ファイルに
# 貼り付けて使うか、別ファイルとして読み込ませます。
#
# 起動:
#   virtual-avatar-connect                   # 既定で ./conf.toml を使う
#   virtual-avatar-connect ./conf.other.toml # 明示指定
#
# ---- 使い始めの 3 ステップ --------------------------------------------
#  1. GUI をビルド:  cd gui && npm install && npm run build
#  2. VAC を起動:    ./virtual-avatar-connect (or cargo run)
#  3. ブラウザで     http://127.0.0.1:57000/gui/ を開いて Flowgraph タブへ
#
# サンプル Flowgraph は `flowgraph.example/` 配下にあります。
# 空から始める場合、GUI の Flowgraph タブで「New」するだけで `flowgraph/`
# ディレクトリが自動作成され、最初の `*.flowgraph.toml` が作れます。
# =========================================================================


# -------------------------------------------------------------------------
# 1. 実行リソース
# -------------------------------------------------------------------------

# 同時並行で走らせる Tokio ワーカー数。未指定ならコア数に自動合わせ。
# 4〜8 が現実的な運用値。
workers = 8

# ログレベル: "Error" / "Warn" / "Info" / "Debug" / "Trace" / "Off"
# 未指定時 "Info"。
# log_level = "Info"


# -------------------------------------------------------------------------
# 2. Web UI / Control Panel (GUI)
# -------------------------------------------------------------------------

# 内蔵 HTTP サーバの bind address。
# GUI (`/gui/`)、Control API (`/api/v1/control/`)、WS (`/ws/control`) はすべて
# ここから配信される。
# web_ui_address = "127.0.0.1:57000"

# actix-web のレスポンス圧縮を無効化したい場合のみ false。
# web_ui_compress = true

# `/resources/*` で配信される静的ファイル置き場。
# web_ui_resources_path = "resources"

# GUI (Phase VI-β Control Panel) のビルド成果物ディレクトリ。
# 存在しない場合は「ビルド手順を案内する HTML」が返るため起動自体は壊れない。
# gui_dist_path = "gui/dist"


# -------------------------------------------------------------------------
# 3. Flowgraph（本丸）
# -------------------------------------------------------------------------

# `*.flowgraph.toml` を再帰的に走査するルートディレクトリ。
# 存在しなくても起動は継続し、空ランタイムで立ち上がる（GUI から作成可能）。
# flowgraph_dir = "flowgraph"

# Note: `v1_processors_enabled` は δ-9 (v0.9.x) で V1 processor 層の除去に伴い削除された。
#       `[[processors]]` エントリは警告を出すのみで実行されない。Flowgraph runtime が唯一のエンジン。


# -------------------------------------------------------------------------
# 4. 永続化 / 添付ファイル
# -------------------------------------------------------------------------

# チャンネルデータを RON 形式で保存するパス。未指定なら永続化なし。
# v2 でも V1 互換の ChannelDatum 配列形式で保存される（GUI の「Channels」タブで可視化）。
state_data_path = "channel-data.ron"

# 保存ファイルの見た目を整形（診断時に便利）。通常 false でも良い。
state_data_pretty = true

# 入力があるたびに自動保存する。false にすると `/save-state` 手動コマンドのみ。
state_data_auto_save = true

# 保持する ChannelDatum 件数上限。未指定で 256。
# state_data_capacity = 256

# `ChannelDatum.attachments` の Inline 添付を許す最大バイト数。超過分は
# 自動的に File 添付に降格（runtime_dir 配下に保存）。既定 32 KiB。
# attachment_inline_max_bytes = 32768

# ランタイム一時ディレクトリ。未指定で OS 既定
# （Windows: %LOCALAPPDATA%\virtual-avatar-connect\runtime）。
# 起動時に古いセッションはベストエフォートで掃除される。
# runtime_dir = "runtime"


# -------------------------------------------------------------------------
# 5. Control API 認証
# -------------------------------------------------------------------------

# `/api/v1/control/*` と `/ws/control` の認証ポリシー。
# 未指定時の既定: loopback (127.0.0.1 / ::1) 無認証 + LAN は Bearer 必須。
# 詳細は `conf.example-control-api.toml` を参照。
# [control_api]
# require_token_for_loopback = false
# require_token_for_non_loopback = true
# token = "ここに Bearer token を書くか、未指定なら起動時に自動生成される"


# -------------------------------------------------------------------------
# 6. 外部サービス連携（任意）
# -------------------------------------------------------------------------
# 個別サービスの設定は `conf.example-*.toml` を参照して必要なセクションだけ
# コピーして本ファイルに書き足す想定。以下はよく使うものへの道標。
#
#   - Twitch Chat / EventSub / ban / timeout: conf.example-twitch.toml
#   - OpenAI Chat（AI Persona）:              conf.example-openai-chat.toml
#   - TTS（OS / VOICEVOX / AivisSpeech / CoeiroInk / 棒読みちゃん）: conf.example-tts.toml
#   - OCR / Screenshot（Windows）:            conf.example-ss-ocr.toml
#   - Translation（GAS / LibreTranslate）:    conf.example-translate.toml
#   - Voice 認識（Vosk / Whisper）:            conf.example-voice.toml
#   - Command / Modify / DictionaryCommand:   conf.example-chat-filters.toml
#   - Control API 認証:                       conf.example-control-api.toml
#   - 起動時 run_with:                        conf.example--run-with.toml
#
# これらの設定は「外部サービスへの接続情報」であって、**データの配線は
# Flowgraph 側（`*.flowgraph.toml`）** で行う、という切り分けが v2 の肝です。
